<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Videos — The 25 Most Influential Dallas Recording Artists</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Black&family=Archivo:wght@400;600;700;800&family=Oswald:wght@400;600;700&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />

  <style>
    /* ---- Videos page overrides ---- */
    body { background: var(--ink); color: var(--white); }

    a { color: var(--orange); }
    a:hover { color: var(--white); }

    .vp-nav {
      position: sticky; top: 0; z-index: 200;
      background: var(--ink);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex; align-items: center; gap: 16px;
      padding: 0 clamp(16px,4vw,56px);
      height: 52px;
    }
    .vp-nav__back {
      display: flex; align-items: center; gap: 6px;
      font-family: var(--sans); font-size: 13px; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: rgba(255,255,255,0.5); text-decoration: none;
      transition: color 0.15s;
    }
    .vp-nav__back:hover { color: var(--white); }
    .vp-nav__back svg { flex-shrink: 0; }
    .vp-nav__divider { width: 1px; height: 20px; background: rgba(255,255,255,0.15); }
    .vp-nav__title {
      font-family: var(--sans); font-size: 13px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--white);
    }
    .vp-nav__title b { color: var(--orange); }

    /* ---- Page layout ---- */
    .vp-page {
      max-width: 1280px;
      margin: 0 auto;
      padding: clamp(32px,5vw,64px) clamp(16px,4vw,56px) 96px;
    }

    /* ---- Section header ---- */
    .vp-section { margin-bottom: clamp(48px,6vw,80px); }
    .vp-section__head {
      display: flex; align-items: baseline; gap: 16px;
      margin-bottom: 28px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .vp-section__label {
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--orange);
    }
    .vp-section__title {
      font-family: var(--display); font-size: clamp(28px,3.5vw,46px);
      font-weight: 300; color: var(--white); line-height: 1;
      text-transform: uppercase;
    }
    .vp-section__count {
      font-family: var(--sans); font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-left: auto;
    }

    /* ---- Feature card (The Film) ---- */
    .vp-feature {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 32px;
      align-items: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.2s;
    }
    .vp-feature:hover { background: rgba(255,255,255,0.07); }
    @media (max-width: 720px) { .vp-feature { grid-template-columns: 1fr; } }
    .vp-feature__thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: var(--ink-soft);
      overflow: hidden;
    }
    .vp-feature__thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s;
    }
    .vp-feature:hover .vp-feature__thumb img { transform: scale(1.03); }
    .vp-feature__play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.3);
      transition: background 0.2s;
    }
    .vp-feature:hover .vp-feature__play { background: rgba(0,0,0,0.15); }
    .vp-feature__play-btn {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 24px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .vp-feature:hover .vp-feature__play-btn { transform: scale(1.08); }
    .vp-feature__meta { padding: 32px; }
    .vp-feature__kicker {
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--orange); margin-bottom: 12px;
    }
    .vp-feature__title {
      font-family: var(--display); font-weight: 300; text-transform: uppercase;
      font-size: clamp(24px,3vw,42px); line-height: 1.05;
      color: var(--white); margin: 0 0 16px;
    }
    .vp-feature__desc {
      font-family: var(--serif); font-size: 16px;
      color: rgba(255,255,255,0.65); line-height: 1.6;
      margin: 0;
    }

    /* ---- Video grid ---- */
    .vp-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    /* ---- Video card ---- */
    .vp-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }
    .vp-card:hover { background: rgba(255,255,255,0.08); transform: translateY(-2px); }
    .vp-card__thumb {
      position: relative;
      aspect-ratio: 16/9;
      background: #140808;
      overflow: hidden;
    }
    .vp-card__thumb img {
      width: 100%; height: 100%; object-fit: cover;
      transition: transform 0.4s;
    }
    .vp-card:hover .vp-card__thumb img { transform: scale(1.04); }
    .vp-card__play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.25);
    }
    .vp-card__play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--blue);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.5);
      transition: transform 0.2s;
    }
    .vp-card:hover .vp-card__play-btn { transform: scale(1.1); }
    .vp-card__rank {
      position: absolute; top: 10px; left: 10px;
      font-family: var(--display); font-size: 13px; font-weight: 700;
      color: var(--white); background: var(--orange);
      padding: 2px 7px; line-height: 1.4;
    }
    .vp-card__meta { padding: 16px 18px 20px; }
    .vp-card__kicker {
      font-family: var(--sans); font-size: 10px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--orange); margin-bottom: 6px;
    }
    .vp-card__title {
      font-family: var(--display); font-weight: 300;
      font-size: 40px; line-height: 1.1; text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--white); margin: 0 0 6px;
    }
    .vp-card__sub {
      font-family: var(--serif);
      font-size: 13px; color: rgba(255,255,255,0.45);
      margin: 0;
    }

    /* ---- Placeholder card ---- */
    .vp-card--coming {
      opacity: 0.4;
      cursor: default;
      pointer-events: none;
    }
    .vp-card--coming .vp-card__thumb {
      background: repeating-linear-gradient(
        45deg, #1a0a04, #1a0a04 10px, #200d06 10px, #200d06 20px
      );
    }
    .vp-card__coming-label {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: rgba(255,255,255,0.3);
    }

    /* ---- Modal ---- */
    .vp-modal {
      position: fixed; inset: 0; z-index: 9000;
      background: rgba(10,3,1,0.95);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 20px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.2s;
    }
    .vp-modal.open { opacity: 1; pointer-events: all; }
    .vp-modal__box {
      width: 100%; max-width: 960px;
    }
    .vp-modal__head {
      display: flex; align-items: flex-start; justify-content: space-between;
      margin-bottom: 12px; gap: 16px;
    }
    .vp-modal__kicker {
      font-family: var(--sans); font-size: 11px; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.14em;
      color: var(--orange); margin-bottom: 4px;
    }
    .vp-modal__title {
      font-family: var(--display); font-size: clamp(18px,2.5vw,30px);
      font-weight: 300; text-transform: uppercase;
      color: var(--white); margin: 0;
    }
    .vp-modal__close {
      background: none; border: none; cursor: pointer;
      color: rgba(255,255,255,0.5); font-size: 28px; line-height: 1;
      padding: 0; flex-shrink: 0;
      transition: color 0.15s;
    }
    .vp-modal__close:hover { color: var(--white); }
    .vp-modal__stage {
      position: relative; width: 100%;
      aspect-ratio: 16/9;
      background: #000;
    }
    .vp-modal__stage iframe {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script src="data.js"></script>

  <script type="text/babel">
    const { useState, useEffect, useCallback } = React;

    /* ---- helpers ---- */
    function thumbUrl(id) {
      return `https://videodelivery.net/${id}/thumbnails/thumbnail.jpg?time=3s&height=400`;
    }

    function PlayIcon({ size = 20 }) {
      return (
        <svg width={size} height={size} viewBox="0 0 20 20" fill="none">
          <polygon points="5,3 17,10 5,17" fill="white" />
        </svg>
      );
    }

    /* ---- Modal ---- */
    function Modal({ data, onClose }) {
      useEffect(() => {
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        window.addEventListener("keydown", handler);
        return () => window.removeEventListener("keydown", handler);
      }, [onClose]);

      const open = !!data;
      return (
        <div className={"vp-modal" + (open ? " open" : "")} onClick={onClose}>
          <div className="vp-modal__box" onClick={(e) => e.stopPropagation()}>
            <div className="vp-modal__head">
              <div>
                <div className="vp-modal__kicker">{data?.kicker}</div>
                <h3 className="vp-modal__title">{data?.title}</h3>
              </div>
              <button className="vp-modal__close" onClick={onClose} aria-label="Close">&times;</button>
            </div>
            <div className="vp-modal__stage">
              {open && data?.video && (
                <iframe
                  src={`https://iframe.cloudflarestream.com/${data.video}?autoplay=true`}
                  title={data.title}
                  allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                  allowFullScreen
                />
              )}
            </div>
          </div>
        </div>
      );
    }

    /* ---- Feature card ---- */
    function FeatureCard({ kicker, title, desc, video, onPlay }) {
      return (
        <div className="vp-feature" onClick={() => onPlay({ kicker, title, video })}>
          <div className="vp-feature__thumb">
            <img src={thumbUrl(video)} alt={title} loading="lazy" />
            <div className="vp-feature__play">
              <div className="vp-feature__play-btn"><PlayIcon size={28} /></div>
            </div>
          </div>
          <div className="vp-feature__meta">
            <div className="vp-feature__kicker">{kicker}</div>
            <h2 className="vp-feature__title">{title}</h2>
            {desc && <p className="vp-feature__desc">{desc}</p>}
          </div>
        </div>
      );
    }

    /* ---- Video card ---- */
    function VideoCard({ kicker, title, sub, video, rank, onPlay }) {
      return (
        <div className="vp-card" onClick={() => onPlay({ kicker, title, video })}>
          <div className="vp-card__thumb">
            <img src={thumbUrl(video)} alt={title} loading="lazy" />
            <div className="vp-card__play">
              <div className="vp-card__play-btn"><PlayIcon size={18} /></div>
            </div>
            {rank && <div className="vp-card__rank">{String(rank).padStart(2,"0")}</div>}
          </div>
          <div className="vp-card__meta">
            <div className="vp-card__kicker">{kicker}</div>
            <p className="vp-card__title">{title}</p>

          </div>
        </div>
      );
    }

    /* ---- Coming soon card ---- */
    function ComingSoonCard({ title }) {
      return (
        <div className="vp-card vp-card--coming">
          <div className="vp-card__thumb">
            <div className="vp-card__coming-label">Coming Soon</div>
          </div>
          <div className="vp-card__meta">
            <div className="vp-card__kicker">In Conversation</div>
            <p className="vp-card__title">{title}</p>
          </div>
        </div>
      );
    }

    /* ---- App ---- */
    function App() {
      const [modal, setModal] = useState(null);
      const open = useCallback((data) => setModal(data), []);
      const close = useCallback(() => setModal(null), []);

      const F = window.FEATURE;
      const INTRO = window.INTRO;
      const artistVideos = window.ARTISTS.filter((a) => a.hasVideo && a.video && a.name !== "Centro-Matic");

      return (
        <>
          {/* Nav */}
          <nav className="vp-nav">
            <a className="vp-nav__back" href="index.html">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <path d="M10 3L5 8l5 5" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
              The List
            </a>
            <div className="vp-nav__divider"></div>
            <div className="vp-nav__title">THE <b>25</b> — Videos</div>
          </nav>

          <main className="vp-page">

            {/* The Film — full-width embed */}
            <section className="vp-section" style={{ marginBottom: "clamp(48px,6vw,80px)" }}>
              <div style={{ marginBottom: "20px" }}>
                <div style={{ fontFamily: "var(--sans)", fontSize: "11px", fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.14em", color: "var(--orange)", marginBottom: "6px" }}>D Magazine — July 2026</div>
                <div style={{ fontFamily: "var(--display)", fontSize: "clamp(22px,2.5vw,34px)", fontWeight: 300, textTransform: "uppercase", color: "rgba(255,255,255,0.5)", lineHeight: 1 }}>The 25 Most Influential Dallas Recording Artists</div>
              </div>
              <div style={{ position: "relative", width: "100%", aspectRatio: "16/9", background: "#000" }}>
                <iframe
                  src={`https://iframe.cloudflarestream.com/${F.heroVideo}`}
                  title="The 25 Most Influential Dallas Recording Artists"
                  allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
                  allowFullScreen
                  style={{ position: "absolute", inset: 0, width: "100%", height: "100%", border: "none" }}
                />
              </div>
            </section>

            {/* Artist Bios */}
            <section className="vp-section">
              <div className="vp-section__head">
                <span className="vp-section__label">Profiles</span>
                <span className="vp-section__title">Artist Bios</span>
                <span className="vp-section__count">{artistVideos.length} videos</span>
              </div>
              <div className="vp-grid">
                {artistVideos.map((a) => (
                  <VideoCard
                    key={a.rank}
                    kicker={`No. ${a.rank} — ${a.genre}`}
                    title={a.name}
                    sub={a.place}
                    video={a.video}
                    rank={a.rank}
                    onPlay={open}
                  />
                ))}
              </div>
            </section>

            {/* In Conversation — placeholder */}
            <section className="vp-section">
              <div className="vp-section__head">
                <span className="vp-section__label">Coming Soon</span>
                <span className="vp-section__title">In Conversation</span>
              </div>
              <div className="vp-grid">
                <ComingSoonCard title="Why Denton, TX Produces So Much Great Music" />
                <ComingSoonCard title="Deep Ellum: The Scene That Built Dallas" />
                <ComingSoonCard title="The Studio Culture of North Texas" />
              </div>
            </section>

          </main>

          <Modal data={modal} onClose={close} />
        </>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>

  <template id="__bundler_thumbnail">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 56">
      <rect width="80" height="56" fill="#1a0a04"/>
      <circle cx="40" cy="28" r="14" fill="#16a3df"/>
      <polygon points="36,21 36,35 50,28" fill="white"/>
    </svg>
  </template>
</body>
</html>
